services:
  postgres:
    image: postgres:16-alpine
    container_name: yakirim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-root1234}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-yakirim}
    ports:
      - '5432:5432'
    volumes:
      - yakirim-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_DB_USERNAME:-root} -d ${POSTGRES_DB_NAME:-yakirim}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yakirim-pg-data:
