# PR 과 develop·main 푸시마다 도는 검사. 배포는 Render 가 main 을 보고 따로 한다 (render.yaml).
#
# 핵심은 마지막 두 단계다. migrationsRun: true 라 마이그레이션이 실패하면 앱이 안 뜨고 = 배포 실패인데,
# 타입체크로는 절대 못 잡는다. 그래서 빈 Postgres 에서 운영과 같은 방식으로 부팅해 본다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root1234
          POSTGRES_DB: yakirim_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 부팅 검사용. 값은 아무거나 — 비어 있으면 GoogleStrategy 가 부팅을 막는다
    env:
      TZ: Asia/Seoul
      POSTGRES_DB_HOST: localhost
      POSTGRES_DB_USERNAME: root
      POSTGRES_DB_PASSWORD: root1234
      POSTGRES_DB_NAME: yakirim_ci
      POSTGRES_DB_SSL: 'false'
      JWT_CMS_ACCESS_SECRET_KEY: ci
      JWT_CMS_REFRESH_SECRET_KEY: ci
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      GOOGLE_REDIRECT_URI: http://localhost/api/auth/google/callback
      WEB_BASE_URL: http://localhost
      TOKEN_ENCRYPTION_KEY: ci

    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Lint · 포맷
        run: |
          pnpm --filter @yakirim/web exec eslint src
          pnpm exec eslint "apps/api/src/**/*.ts"
          pnpm exec prettier --check "apps/api/src/**/*.ts"

      - name: 웹 빌드 (tsc -b 포함)
        run: pnpm build:web

      - name: 웹 테스트
        run: pnpm --filter @yakirim/web test

      - name: API 빌드
        run: pnpm build:api

      # 정체 판정·회차 재정렬·수료 제안처럼 SQL 에 걸린 로직은 실제 Postgres 에서 검증한다 (별도 DB yakirim_test)
      - name: API 테스트
        run: pnpm --filter @yakirim/api test

      - name: 빈 DB 에서 운영 모드로 부팅 — 마이그레이션 전체 실행 + 헬스체크
        working-directory: apps/api
        env:
          NODE_ENV: production
          PORT: '3999'
        run: |
          node dist/src/main > boot.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3999/api/health > /dev/null; then
              echo "헬스체크 통과"
              kill $PID
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::앱이 부팅 중에 종료됐다 — 마이그레이션 실패일 가능성이 크다"
              grep -v '^query' boot.log | tail -80
              exit 1
            fi
            sleep 2
          done
          echo "::error::2분 안에 헬스체크가 통과하지 않았다"
          grep -v '^query' boot.log | tail -80
          kill $PID
          exit 1

      # 엔티티를 바꾸고 마이그레이션을 빠뜨리면 여기서 걸린다. 걸리면 로그에 필요한 SQL 이 나온다.
      - name: 스키마 드리프트 검사 (엔티티 ↔ 마이그레이션)
        working-directory: apps/api
        run: pnpm exec ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js migration:generate --check -d migrationConfig.ts src/database/migration/DriftCheck
